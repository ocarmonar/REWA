<!DOCTYPE html>
<html lang="es-EC">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Club Deportivo REWA — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Azul marino y dorado: colores reales de rewa.com.ec (sitio oficial). */
  --azul:#20274c; --azul-dark:#141830; --azul-bg:#e7eef6;
  --dorado:#e1a404; --dorado-bg:#fdf3dc;
  --verde:#2e7d32; --verde-bg:#e8f5e9;
  --ambar:#b7791f; --ambar-bg:#fff8e1;
  --rojo:#c62828; --rojo-bg:#fdecea;
  --gris:#6b7280; --gris-bg:#f1f2f4;
  --bg:#f7f8fa; --card:#ffffff; --border:#e3e6ea; --text:#1f2530;
  --font-heading:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
h1,h2,h3{font-family:var(--font-heading)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}
h1,h2,h3{margin:0}
.hidden{display:none !important}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--azul),var(--azul-dark));padding:20px}
.login-card{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:420px;padding:36px}
.login-logo{text-align:center;margin-bottom:22px}
.login-logo .badge{display:inline-block;background:var(--azul);color:#fff;width:56px;height:56px;border-radius:50%;font-weight:800;font-size:20px;line-height:56px;margin-bottom:10px}
.login-logo h1{font-size:20px;color:var(--azul)}
.login-logo p{color:var(--gris);font-size:13px;margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#374151}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--azul)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600}
.btn-primary{background:var(--azul);color:#fff}
.btn-primary:hover{background:var(--azul-dark)}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--gris-bg)}
.btn-danger{background:var(--rojo-bg);color:var(--rojo)}
.btn-verde{background:var(--verde);color:#fff}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-block{width:100%}
.btn-link{background:none;border:none;color:var(--azul);font-weight:600;padding:0}
.demo-users{margin-top:18px;border-top:1px dashed var(--border);padding-top:16px}
.demo-users p{font-size:12.5px;color:var(--gris);margin:0 0 8px}
.demo-user-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--azul-bg);border:1px solid transparent;border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:13px}
.demo-user-btn:hover{border-color:var(--azul)}
.demo-user-btn small{color:var(--gris);font-weight:400}

/* ---------- Layout ---------- */
.app-shell{display:flex;min-height:100vh}
.topbar{display:none;position:sticky;top:0;background:var(--azul);color:#fff;padding:10px 14px;align-items:center;gap:10px;z-index:20}
.topbar button{background:none;border:none;color:#fff;font-size:20px}
.sidebar{width:230px;flex-shrink:0;background:var(--azul);color:#fff;min-height:100vh;display:flex;flex-direction:column;position:sticky;top:0;align-self:flex-start;height:100vh}
.sidebar .brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar .brand b{display:block;font-size:15px}
.sidebar .brand span{font-size:12px;opacity:.7}
.sidebar nav{flex:1;padding:12px;overflow-y:auto}
.sidebar nav a{display:block;padding:9px 12px;border-radius:8px;color:#fff;text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:3px;opacity:.85}
.sidebar nav a:hover{background:rgba(255,255,255,.08);opacity:1}
.sidebar nav a.active{background:rgba(255,255,255,.18);opacity:1}
.sidebar .user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px}
.sidebar .user .name{font-weight:600;margin-bottom:2px}
.sidebar .user .role{opacity:.7;text-transform:capitalize;margin-bottom:8px}
.main{flex:1;padding:26px;min-width:0}
.demo-banner{background:#fef3c7;color:#92400e;font-size:12.5px;padding:7px 14px;text-align:center;font-weight:600}

@media (max-width:860px){
  .topbar{display:flex}
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .2s;z-index:30}
  .sidebar.open{transform:translateX(0)}
  .main{padding:16px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
}

/* ---------- Componentes ---------- */
.page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.page-head h1{font-size:20px;color:var(--azul)}
.page-head .sub{color:var(--gris);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.kpi .t{font-size:12.5px;color:var(--gris);margin-bottom:6px}
.kpi .v{font-size:22px;font-weight:800}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.b-verde{background:var(--verde-bg);color:var(--verde)}
.b-ambar{background:var(--ambar-bg);color:var(--ambar)}
.b-rojo{background:var(--rojo-bg);color:var(--rojo)}
.b-gris{background:var(--gris-bg);color:var(--gris)}
.b-azul{background:var(--azul-bg);color:var(--azul)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--gris);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em;padding:9px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;overflow-x:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px}
.empty{padding:30px;text-align:center;color:var(--gris);font-size:13.5px}
.session-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.session-item .r{font-weight:700}
.session-item .c{color:var(--gris);font-size:12.5px}
.attn-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.attn-card .nm{font-weight:600;margin-bottom:8px;font-size:13.5px}
.state-btns{display:flex;flex-wrap:wrap;gap:6px}
.state-btn{border:1px solid var(--border);background:#fff;color:var(--gris);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;min-height:38px}
.state-btn.sel-presente{background:var(--verde-bg);color:var(--verde);border-color:transparent}
.state-btn.sel-falta{background:var(--rojo-bg);color:var(--rojo);border-color:transparent}
.state-btn.sel-tarde{background:var(--ambar-bg);color:var(--ambar);border-color:transparent}
.state-btn.sel-justificado, .state-btn.sel-permiso{background:var(--azul-bg);color:var(--azul);border-color:transparent}
.state-btn.sel-lesionado{background:var(--gris-bg);color:var(--gris);border-color:transparent}
.save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px;margin:20px -18px -18px;border-radius:0 0 12px 12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.two-col{grid-template-columns:1fr}}
.section-title{font-weight:700;margin-bottom:10px;font-size:14.5px}
dl.breakdown{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13.5px;margin:0}
dl.breakdown dt{color:var(--gris)}
dl.breakdown dd{margin:0;text-align:right}
dl.breakdown .tot dt,dl.breakdown .tot dd{font-weight:700;border-top:1px solid var(--border);padding-top:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:420px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--azul-bg);color:var(--azul);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.link-back{font-size:13px;color:var(--azul);font-weight:600;text-decoration:none;display:inline-block;margin-bottom:12px}
.import-row-error{background:var(--rojo-bg)}
.import-row-dup{background:var(--ambar-bg)}
.stack{display:flex;flex-direction:column;gap:4px}
.muted{color:var(--gris);font-size:12.5px}
</style>
</head>

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p) => (p||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const fmtMoney = (n) => new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format(n||0);
const fmtDate = (s) => { if(!s) return ''; const d = new Date(s+'T00:00:00'); return new Intl.DateTimeFormat('es-EC',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d); };
const fmtDateTime = (s) => { if(!s) return ''; const d = new Date(s); return new Intl.DateTimeFormat('es-EC',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d); };
// Formatea SIEMPRE con los componentes de fecha LOCALES (nunca toISOString,
// que usa UTC y se desfasa un día en Ecuador -UTC-5- durante la tarde/noche).
function dateOnly(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const todayStr = () => dateOnly(new Date());
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return dateOnly(d); }
function h(strings, ...vals){ return strings.reduce((acc,s,i)=> acc + s + (i<vals.length ? vals[i] : ''), ''); }

const APE_PROFES = ['Guamán','Cevallos','Andrade','Moreta','Villacís','Cadena','Zambrano','Naranjo','Freire','Espinoza','Coronel','Yépez','Barragán','Muñoz','Pazmiño'];
const NOM_EST = ['Mateo','Sebastián','Emilia','Valentina','Josué','Doménica','Isaac','Camila','Martín','Renata','Julián','Sofía','Nicolás','Antonella','Samuel','Ariana','Emilio','Zoe','Adrián','Mía','David','Salomé','Thiago','Abigail','Joaquín','Victoria','Benjamín','Amelia','Gael','Regina'];
const APE_EST = ['Rosero','Tapia','Játiva','Benítez','Quishpe','Lema','Sangucho','Vega','Aguirre','Peñafiel','Carrera','Salinas','Bautista','Ortiz','Salazar','Endara','Bravo','Cárdenas','Herrera','Toapanta'];

function generarSeed(){
  const db = { campus:[], ramas:[], usuarios:[], profesores:[], profesor_rama:[], estudiantes:[], estudiante_rama:[],
    horarios:[], sesiones:[], asistencias:[], justificaciones:[], mensualidades:[], ajustes:[], pagos:[], auditoria:[], importaciones:[] };

  db.campus = [
    {id:'cam1', nombre:'ISM North', direccion:'Av. Eloy Alfaro N39-115, Quito', activo:true},
    {id:'cam2', nombre:'ISM West', direccion:'Av. Occidental y Mariana de Jesús, Quito', activo:true},
    {id:'cam3', nombre:'ISM Quito', direccion:'Av. 6 de Diciembre N24-296, Quito', activo:true},
  ];
  db.ramas = [
    {id:'ram1', nombre:'Fútbol', monto_mensual_base:35, activo:true},
    {id:'ram2', nombre:'Básquetbol', monto_mensual_base:32, activo:true},
    {id:'ram3', nombre:'Vóleybol', monto_mensual_base:30, activo:true},
    {id:'ram4', nombre:'Natación', monto_mensual_base:45, activo:true},
  ];

  db.usuarios.push({id:'u_admin1', nombres:'Andrea', apellidos:'Salazar Ponce', email:'admin1@rewa.ec', rol:'administrador', activo:true});
  db.usuarios.push({id:'u_admin2', nombres:'Diego', apellidos:'Vaca Montalvo', email:'admin2@rewa.ec', rol:'administrador', activo:true});
  db.usuarios.push({id:'u_admin3', nombres:'Mónica', apellidos:'Chávez Rivas', email:'admin3@rewa.ec', rol:'administrador', activo:true});
  db.usuarios.push({id:'u_gerente', nombres:'Fernando', apellidos:'Torres Guerrero', email:'gerente@rewa.ec', rol:'gerente', activo:true});

  for(let i=0;i<15;i++){
    const uidP = 'u_prof'+(i+1);
    db.usuarios.push({id:uidP, nombres:NOM_PROFES[i], apellidos:APE_PROFES[i], email:'profe'+(i+1)+'@rewa.ec', rol:'profesor', activo:true});
    db.profesores.push({id:'prof'+(i+1), usuario_id:uidP, nombres:NOM_PROFES[i], apellidos:APE_PROFES[i], telefono:'09'+(80000000+i*111), activo:true});
  }

  let pIdx = 0;
  const nextProf = () => db.profesores[pIdx++ % 15].id;
  db.ramas.forEach(r=>{
    db.campus.forEach(c=>{
      db.profesor_rama.push({id:uid('pr'), profesor_id:nextProf(), rama_id:r.id, campus_id:c.id, tipo:'principal', activo:true});
      if(c.id==='cam1') db.profesor_rama.push({id:uid('pr'), profesor_id:nextProf(), rama_id:r.id, campus_id:c.id, tipo:'asistente', activo:true});
    });
  });

  const horaBase = {Fútbol:'15:00', Básquetbol:'16:30', Vóleybol:'15:00', Natación:'07:00'};
  db.ramas.forEach(r=>{
    db.campus.forEach(c=>{
      const principal = db.profesor_rama.find(pr=>pr.rama_id===r.id && pr.campus_id===c.id && pr.tipo==='principal');
      ['lunes','miercoles','viernes'].forEach(dia=>{
        const [hh,mm] = horaBase[r.nombre].split(':').map(Number);
        const fin = new Date(2000,0,1,hh,mm); fin.setMinutes(fin.getMinutes()+90);
        db.horarios.push({
          id:uid('hor'), rama_id:r.id, campus_id:c.id, dia,
          hora_inicio: horaBase[r.nombre], hora_fin: String(fin.getHours()).padStart(2,'0')+':'+String(fin.getMinutes()).padStart(2,'0'),
          profesor_id: principal.profesor_id, estado:'activo'
        });
      });
    });
  });

  const estadosCiclo = ['activo','activo','activo','activo','activo','activo','activo','activo','activo','activo','activo','activo','activo','activo','activo','activo','activo','activo','inactivo','lesionado'];
  for(let i=0;i<60;i++){
    const campusId = db.campus[i%3].id;
    const estId = 'est'+(i+1);
    const nacim = new Date(2010,0,1); nacim.setDate(nacim.getDate() + ((i*47)%3650));
    db.estudiantes.push({
      id: estId,
      nombres: NOM_EST[i%30],
      apellidos: APE_EST[i%20] + ' ' + APE_EST[(i+3)%20],
      fecha_nacimiento: dateOnly(nacim),
      campus_principal_id: campusId,
      estado: estadosCiclo[i%20],
      contacto_telefono: '09'+(70000000+i*137),
      contacto_email: (NOM_EST[i%30]).toLowerCase()+'.'+(i+1)+'@estudiante.rewa.ec',
      representante_nombre: 'Representante de '+NOM_EST[i%30],
      representante_telefono: '09'+(60000000+i*91),
      representante_email: 'representante'+(i+1)+'@correo.com',
      curso: (i%4===0) ? ((8+(i%5))+'vo EGB') : null,
      contacto_emergencia_nombre: null,
      contacto_emergencia_telefono: null,
      observaciones_medicas: (i%13===0) ? 'Asma leve - lleva inhalador de rescate.' : null,
    });

    const nRamas = 1 + (i%2);
    for(let j=0;j<nRamas;j++){
      const rama = db.ramas[(i+j)%4];
      if(!db.estudiante_rama.some(er=>er.estudiante_id===estId && er.rama_id===rama.id)){
        db.estudiante_rama.push({id:uid('er'), estudiante_id:estId, rama_id:rama.id, campus_id:campusId, fecha_inscripcion: addDays(todayStr(), -((i*3)%180)), estado:'activo'});
      }
    }
  }

  // --- Horarios/sesiones: ventana móvil -14 a +7 días desde hoy, siempre incluye "hoy" (mejora Parte A, punto 5) ---
  regenerarSesiones(db, -14, 7);

  // --- Asistencia de ejemplo para sesiones pasadas ---
  const estadosAsistCiclo = ['presente','presente','presente','presente','presente','presente','presente','falta','tarde','justificado'];
  let kAsist = 0;
  db.sesiones.filter(s=>s.fecha < todayStr() && s.estado!=='cancelada').forEach(s=>{
    const hor = db.horarios.find(h=>h.id===s.horario_id);
    const inscritos = db.estudiante_rama.filter(er=>er.rama_id===hor.rama_id && er.campus_id===hor.campus_id && er.estado==='activo');
    inscritos.forEach(er=>{
      kAsist++;
      db.asistencias.push({id:uid('asi'), sesion_id:s.id, estudiante_id:er.estudiante_id, estado:estadosAsistCiclo[kAsist%10],
        observacion_individual:null, usuario_registro: db.profesores.find(p=>p.id===hor.profesor_id)?.usuario_id || 'u_admin1',
        fecha_registro:new Date().toISOString(), corregido:false});
    });
    s.estado = 'registro_completado';
  });

  // dos sesiones canceladas de ejemplo
  db.sesiones.filter(s=>s.fecha < todayStr()).slice(0,2).forEach(s=>{
    s.estado='cancelada'; s.motivo_cancelacion='Lluvia intensa - cancha inundada'; s.usuario_cancelacion='u_admin1'; s.fecha_cancelacion=new Date().toISOString();
  });

  // --- Mensualidades + pagos de ejemplo (periodo actual y anterior) ---
  const hoy = new Date();
  const periodos = [
    {mes: hoy.getMonth()+1, anio: hoy.getFullYear()},
    {mes: hoy.getMonth()===0?12:hoy.getMonth(), anio: hoy.getMonth()===0?hoy.getFullYear()-1:hoy.getFullYear()},
  ];
  let kMens = 0;
  periodos.forEach(per=>{
    db.estudiante_rama.filter(er=>er.estado==='activo').forEach(er=>{
      const est = db.estudiantes.find(e=>e.id===er.estudiante_id);
      if(!est || est.estado!=='activo') return;
      const rama = db.ramas.find(r=>r.id===er.rama_id);
      kMens++;
      const mId = uid('mens');
      const fechaLimite = dateOnly(new Date(per.anio, per.mes, 5)); // dia 5 del mes siguiente
      db.mensualidades.push({
        id:mId, estudiante_id:er.estudiante_id, rama_id:er.rama_id, periodo_mes:per.mes, periodo_anio:per.anio,
        monto_base: rama.monto_mensual_base, total_descuentos:0, total_becas:0, total_exoneraciones:0,
        total_a_pagar: rama.monto_mensual_base, total_pagado:0, saldo: rama.monto_mensual_base,
        estado:'pendiente', fecha_limite: fechaLimite, observacion:null, creado_por:'u_admin1', fecha_creacion:new Date().toISOString()
      });

      if(kMens % 5 === 0) db.ajustes.push({id:uid('aj'), mensualidad_id:mId, tipo:'beca', valor_tipo:'porcentaje', valor:20, motivo:'Beca deportiva por desempeño', usuario_id:'u_gerente', fecha:new Date().toISOString(), estado:'activo'});
      else if(kMens % 7 === 0) db.ajustes.push({id:uid('aj'), mensualidad_id:mId, tipo:'descuento', valor_tipo:'monto', valor:5, motivo:'Descuento por hermano inscrito', usuario_id:'u_gerente', fecha:new Date().toISOString(), estado:'activo'});
      else if(kMens % 11 === 0) db.ajustes.push({id:uid('aj'), mensualidad_id:mId, tipo:'exoneracion', valor_tipo:'porcentaje', valor:100, motivo:'Exoneración total - caso socioeconómico', usuario_id:'u_admin1', fecha:new Date().toISOString(), estado:'activo'});

      recalcularMensualidad(db, mId);

      const m = db.mensualidades.find(x=>x.id===mId);
      if(m.saldo > 0 && kMens % 3 === 0){
        db.pagos.push({id:uid('pago'), mensualidad_id:mId, monto:m.saldo, fecha_pago:addDays(todayStr(),-(kMens%15)), metodo_pago:'efectivo', referencia:'REC-'+kMens, observacion:null, estado:'activo', usuario_registro:'u_gerente', fecha_registro:new Date().toISOString()});
        recalcularMensualidad(db, mId);
      } else if(m.saldo > 0 && kMens % 4 === 0){
        db.pagos.push({id:uid('pago'), mensualidad_id:mId, monto:round2(m.saldo/2), fecha_pago:addDays(todayStr(),-(kMens%10)), metodo_pago:'transferencia', referencia:'TRX-'+kMens, observacion:null, estado:'activo', usuario_registro:'u_gerente', fecha_registro:new Date().toISOString()});
        recalcularMensualidad(db, mId);
      }
    });
  });

  db.auditoria.push({id:uid('aud'), tabla:'sistema', registro_id:'-', accion:'seed', detalle:'Datos de demostración generados', usuario:'sistema', fecha:new Date().toISOString()});

  return db;
}

/* =========================================================================
   GENERACIÓN DE SESIONES DESDE HORARIOS (SES-01), ventana móvil
   ========================================================================= */
function regenerarSesiones(db, desdeOffset, hastaOffset){
  const desde = addDays(todayStr(), desdeOffset);
  const hasta = addDays(todayStr(), hastaOffset);
  let f = desde;
  while(f <= hasta){
    const diaSemana = DIAS[new Date(f+'T00:00:00').getDay()];
    db.horarios.filter(hh=>hh.estado==='activo' && hh.dia===diaSemana).forEach(hor=>{
      const existe = db.sesiones.some(s=>s.horario_id===hor.id && s.fecha===f);
      if(!existe){
        db.sesiones.push({
          id: uid('ses'), horario_id: hor.id, fecha:f, hora_inicio:hor.hora_inicio, hora_fin:hor.hora_fin,
          estado: f < todayStr() ? 'sin_registro' : 'programada',
          observacion_general:null, motivo_cancelacion:null, usuario_cancelacion:null, fecha_cancelacion:null
        });
      }
    });
    f = addDays(f, 1);
  }
}

/* =========================================================================
   REGLAS DE NEGOCIO: MENSUALIDADES (espejo de los triggers de schema.sql)
   ========================================================================= */
function recalcularMensualidad(db, mensualidadId){
  const m = db.mensualidades.find(x=>x.id===mensualidadId);
  if(!m || m.estado==='anulado') return;

  const ajustesActivos = db.ajustes.filter(a=>a.mensualidad_id===mensualidadId && a.estado==='activo');
  const sumaTipo = (tipo) => ajustesActivos.filter(a=>a.tipo===tipo)
    .reduce((acc,a)=> acc + (a.valor_tipo==='monto' ? a.valor : round2(m.monto_base * a.valor / 100)), 0);

  const desc = round2(sumaTipo('descuento'));
  const beca = round2(sumaTipo('beca'));
  const exo = round2(sumaTipo('exoneracion'));
  const exoTotal = ajustesActivos.some(a=>a.tipo==='exoneracion' && a.valor_tipo==='porcentaje' && a.valor>=100);

  let totalAPagar = Math.max(round2(m.monto_base - desc - beca - exo), 0);
  const pagosActivos = db.pagos.filter(p=>p.mensualidad_id===mensualidadId && p.estado==='activo');
  const totalPagado = round2(pagosActivos.reduce((acc,p)=>acc+p.monto,0));

  let saldo, estado;
  if(exoTotal || totalAPagar===0){
    totalAPagar = 0; saldo = 0; estado = 'exonerado';
  } else {
    saldo = Math.max(round2(totalAPagar - totalPagado), 0);
    estado = saldo===0 ? 'pagado' : (totalPagado>0 ? 'parcial' : 'pendiente');
  }

  m.total_descuentos=desc; m.total_becas=beca; m.total_exoneraciones=exo;
  m.total_a_pagar=totalAPagar; m.total_pagado=totalPagado; m.saldo=saldo; m.estado=estado;
}

function estadoEfectivo(m){
  if(['pagado','exonerado','anulado'].includes(m.estado)) return m.estado;
  if(m.saldo > 0 && m.fecha_limite < todayStr()) return 'vencido';
  return m.estado;
}

function cargarDB(){
  const raw = localStorage.getItem(STORAGE_KEY);

  db = generarSeed();
  guardarDB();

        break;

      ? db.profesor_rama.filter(pr=>pr.profesor_id===prof.id && pr.activo).map(pr=>pr.rama_id+'|'+pr.campus_id)

let importacionFilas = null; // preview tras parsear el CSV

function plantillaCsv(){
  return 'nombres,apellidos,fecha_nacimiento,campus,representante_nombre,representante_telefono,curso\n' +
    'Juan,Pérez Ríos,2012-05-14,ISM North,María Ríos,0991234567,7mo EGB\n';
}

function parsearCsv(texto){
  const lineas = texto.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(lineas.length===0) return [];
  const encabezados = lineas[0].split(',').map(s=>s.trim());
  return lineas.slice(1).map(linea=>{
    const valores = linea.split(',').map(s=>s.trim());
    const fila = {};
    encabezados.forEach((enc,i)=> fila[enc]=valores[i]||'');
    return fila;
  });
}

function validarFilaImportacion(fila){
  const errores = [];
  if(!fila.nombres) errores.push('nombres es obligatorio');
  if(!fila.apellidos) errores.push('apellidos es obligatorio');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fila.fecha_nacimiento||'')) errores.push('fecha_nacimiento debe ser AAAA-MM-DD');
  const campus = db.campus.find(c=>c.nombre.toLowerCase()===String(fila.campus||'').toLowerCase());
  if(!campus) errores.push('campus "'+fila.campus+'" no existe');
  if(!fila.representante_nombre) errores.push('representante_nombre es obligatorio');
  if(!fila.representante_telefono) errores.push('representante_telefono es obligatorio');

  const duplicado = errores.length===0 && db.estudiantes.some(e=>
    e.nombres.toLowerCase()===fila.nombres.toLowerCase() &&
    e.apellidos.toLowerCase()===fila.apellidos.toLowerCase() &&
    e.fecha_nacimiento===fila.fecha_nacimiento);

  return { errores, duplicado, campusId: campus?.id };
}

function vistaImportacion(usuario){
  if(usuario.rol!=='administrador') return vistaSinPermiso();

  return h`
    <a class="link-back" href="#/estudiantes">← Volver a estudiantes</a>
    <div class="page-head"><h1>Importar estudiantes (Excel/CSV)</h1></div>

    <div class="card" style="margin-bottom:14px">
      <p class="muted">1. Descarga la plantilla, complétala y súbela. 2. Revisa la vista previa (errores y posibles duplicados). 3. Confirma la importación.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn btn-outline" onclick="app.descargarPlantilla()">Descargar plantilla CSV</button>
        <label class="btn btn-primary" style="display:inline-flex;align-items:center">
          Elegir archivo CSV
          <input type="file" accept=".csv" style="display:none" onchange="app.procesarArchivoImportacion(this.files[0])">
        </label>
      </div>
    </div>

    <div id="importPreview">${importacionFilas ? renderPreviewImportacion() : ''}</div>
  `;
}

function renderPreviewImportacion(){
  const validadas = importacionFilas.map(f=>({...f, ...validarFilaImportacion(f)}));
  const okCount = validadas.filter(v=>v.errores.length===0).length;
  const errCount = validadas.filter(v=>v.errores.length>0).length;
  const dupCount = validadas.filter(v=>v.errores.length===0 && v.duplicado).length;

  return h`
    <div class="card">
      <div class="section-title">Vista previa: ${validadas.length} filas — ${okCount} válidas, ${dupCount} posibles duplicados, ${errCount} con errores</div>
      <table>
        <thead><tr><th>Nombres</th><th>Apellidos</th><th>Nacimiento</th><th>Campus</th><th>Estado</th></tr></thead>
        <tbody>
          ${validadas.map(v=>h`
            <tr class="${v.errores.length>0?'import-row-error':(v.duplicado?'import-row-dup':'')}">
              <td>${esc(v.nombres)}</td><td>${esc(v.apellidos)}</td><td>${esc(v.fecha_nacimiento)}</td><td>${esc(v.campus)}</td>
              <td>${v.errores.length>0 ? esc(v.errores.join('; ')) : (v.duplicado ? 'Posible duplicado' : 'OK')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn btn-primary" onclick="app.confirmarImportacion()">Confirmar importación (${okCount} filas)</button>
        <button class="btn btn-outline" onclick="app.cancelarImportacion()">Cancelar</button>
      </div>
    </div>
  `;
}

let pagosFiltro = { q:'', mes: new Date().getMonth()+1, anio: new Date().getFullYear(), estado:'' };

let pagosCampusAbiertos = new Set();

function vistaPagos(usuario){
  let lista = db.mensualidades.filter(m=>m.periodo_mes===Number(pagosFiltro.mes) && m.periodo_anio===Number(pagosFiltro.anio));
  if(pagosFiltro.estado) lista = lista.filter(m=>estadoEfectivo(m)===pagosFiltro.estado);
  if(pagosFiltro.q){
    const q = pagosFiltro.q.toLowerCase();
    lista = lista.filter(m=>{ const e=db.estudiantes.find(x=>x.id===m.estudiante_id); return e && (e.nombres+' '+e.apellidos).toLowerCase().includes(q); });
  }
  lista = lista.sort((a,b)=> (a.fecha_creacion<b.fecha_creacion?1:-1));

  const porCampus = {};
  lista.forEach(m=>{
    const e = db.estudiantes.find(x=>x.id===m.estudiante_id);
    const campusId = e?.campus_principal_id || 'sin-campus';
    (porCampus[campusId] = porCampus[campusId] || []).push(m);
  });
  const campusIds = Object.keys(porCampus).sort((a,b)=>{
    const ca = db.campus.find(c=>c.id===a)?.nombre || '';
    const cb = db.campus.find(c=>c.id===b)?.nombre || '';
    return ca.localeCompare(cb);
  });

  return h`
    <div class="page-head">
      <div><h1>Pagos mensuales</h1><div class="sub">${lista.length} mensualidades en el periodo</div></div>
      ${usuario.rol==='administrador' ? `<button class="btn" style="background:var(--verde);color:#fff" onclick="app.generarMensualidadesPeriodo()">Generar mensualidades del periodo</button>` : ''}
    </div>
    <div class="toolbar">
      <input type="text" placeholder="Buscar estudiante..." value="${esc(pagosFiltro.q)}" oninput="app.filtrarPagos('q', this.value)" style="min-width:200px">
      <select onchange="app.filtrarPagos('mes', this.value)">${MESES.map((m,i)=>`<option value="${i+1}" ${pagosFiltro.mes==i+1?'selected':''}>${m}</option>`).join('')}</select>
      <input type="number" value="${pagosFiltro.anio}" oninput="app.filtrarPagos('anio', this.value)" style="width:90px">
      <select onchange="app.filtrarPagos('estado', this.value)">
        <option value="">Todos los estados</option>
        ${Object.keys(ETQ_MENSUALIDAD).map(k=>`<option value="${k}" ${pagosFiltro.estado===k?'selected':''}>${ETQ_MENSUALIDAD[k].t}</option>`).join('')}
      </select>
    </div>

    ${campusIds.length===0 ? `<div class="empty">No hay mensualidades para este periodo.${usuario.rol==='administrador'?' Genera el periodo con el botón de arriba.':''}</div>` : ''}

    ${campusIds.map(campusId=>{
      const campus = db.campus.find(c=>c.id===campusId);
      const items = porCampus[campusId];
      const abierto = pagosCampusAbiertos.has(campusId);
      const pendientesCampus = items.filter(m=>['pendiente','parcial','vencido'].includes(estadoEfectivo(m))).length;
      return h`
        <div class="card" style="padding:0;margin-bottom:10px;overflow:hidden">
          <button onclick="app.toggleCampusPagos('${campusId}')" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:none;border:none;text-align:left">
            <span style="font-weight:700;color:var(--azul)">${esc(campus?.nombre || 'Sin campus')}</span>
            <span style="display:flex;align-items:center;gap:10px">
              <span class="chip">${items.length} mensualidad${items.length===1?'':'es'}</span>
              ${pendientesCampus>0 ? `<span class="chip" style="background:var(--ambar-bg);color:var(--ambar)">${pendientesCampus} por cobrar</span>` : ''}
              <span style="color:var(--gris)">${abierto ? '▲' : '▼'}</span>
            </span>
          </button>
          ${abierto ? h`
            <div class="table-wrap" style="border:none;border-top:1px solid var(--border);border-radius:0">
              <table>
                <thead><tr><th>Estudiante</th><th>Rama</th><th>Total</th><th>Saldo</th><th>Estado</th><th></th></tr></thead>
                <tbody>
                  ${items.map(m=>{
                    const e = db.estudiantes.find(x=>x.id===m.estudiante_id);
                    const r = db.ramas.find(x=>x.id===m.rama_id);
                    const etq = ETQ_MENSUALIDAD[estadoEfectivo(m)];
                    return h`<tr>
                      <td>${esc(e?.apellidos)} ${esc(e?.nombres)}</td><td>${esc(r?.nombre)}</td>
                      <td>${fmtMoney(m.total_a_pagar)}</td><td>${fmtMoney(m.saldo)}</td>
                      <td><span class="badge ${etq.cls}">${etq.t}</span></td>
                      <td style="text-align:right"><a class="btn-link" href="#/pagos/${m.id}">Ver →</a></td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          ` : ''}
        </div>
      `;
    }).join('')}
  `;
}

    <div class="card" style="margin-bottom:16px">

      <table>
        <thead><tr><th>Fecha</th><th>Método</th><th>Monto</th><th></th><th></th></tr></thead>

function estudiantesDeMisGrupos(usuario){
  if(esGestion(usuario.rol)) return db.estudiantes;
  const prof = profesorPropio(usuario);
  const misRamaCampus = (prof && prof.activo)
    ? db.profesor_rama.filter(pr=>pr.profesor_id===prof.id && pr.activo).map(pr=>pr.rama_id+'|'+pr.campus_id)
    : [];
  const idsPermitidos = new Set(db.estudiante_rama.filter(er=>misRamaCampus.includes(er.rama_id+'|'+er.campus_id)).map(er=>er.estudiante_id));
  return db.estudiantes.filter(e=>idsPermitidos.has(e.id));
}

  manejarLoginManual(e){
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const u = db.usuarios.find(x=>x.email.toLowerCase()===email && x.activo);
    if(!u){
      alert('Correo no encontrado. Usa uno de los usuarios de demostración (p. ej. admin1@rewa.ec, gerente@rewa.ec, profe1@rewa.ec). En este modo demo la contraseña no se valida.');
      return false;
    }
    iniciarSesion(u.id);
    return false;
  },

  cambiarFechaAsistencia(v){ asistenciaFecha = v; render(); },
  filtrarPaseLista(v){ window.__paseListaBusqueda = v; render(); },
  marcarEstado(estudianteId, estado){ if(!window.__paseLista) window.__paseLista={}; window.__paseLista[estudianteId]=estado; render(); },
  marcarTodosPresentes(sesionId){ Object.keys(window.__paseLista||{}).forEach(k=> window.__paseLista[k]='presente'); render(); },

  guardarAsistencia(sesionId){
    const s = db.sesiones.find(x=>x.id===sesionId);
    if(!s) return;
    const usuario = usuarioActual();
    const obsEl = document.getElementById('obsGeneral');
    const estados = window.__paseLista || {};
    Object.keys(estados).forEach(estId=>{
      const existente = db.asistencias.find(a=>a.sesion_id===sesionId && a.estudiante_id===estId);
      if(existente){
        if(existente.estado !== estados[estId]){
          existente.estado = estados[estId];
          existente.corregido = true;
          existente.usuario_correccion = usuario.id;
          existente.fecha_correccion = new Date().toISOString();
          auditar('asistencias', existente.id, 'corregir', 'Estado cambiado a '+estados[estId]);
        }
      } else {
        db.asistencias.push({ id: uid('asi'), sesion_id: sesionId, estudiante_id: estId, estado: estados[estId],
          observacion_individual: null, usuario_registro: usuario.id, fecha_registro: new Date().toISOString(), corregido: false });
      }
    });
    s.estado = 'registro_completado';
    s.observacion_general = obsEl ? obsEl.value : s.observacion_general;
    auditar('sesiones', sesionId, 'pasar_asistencia', 'Asistencia guardada para '+Object.keys(estados).length+' estudiantes');
    guardarDB();
    alert('Asistencia guardada correctamente.');
    render();
  },

  buscarEstudiantes(v){ estudiantesBusqueda = v; render(); },

  crearEstudiante(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const id = uid('est');
    const campusId = fd.get('campus_principal_id');
    const nuevo = {
      id, nombres: fd.get('nombres'), apellidos: fd.get('apellidos'), fecha_nacimiento: fd.get('fecha_nacimiento'),
      campus_principal_id: campusId, estado: 'activo',
      contacto_telefono: null, contacto_email: null,
      representante_nombre: fd.get('representante_nombre'), representante_telefono: fd.get('representante_telefono'),
      representante_email: null, curso: fd.get('curso') || null,
      contacto_emergencia_nombre: null, contacto_emergencia_telefono: null,
      observaciones_medicas: fd.get('observaciones_medicas') || null
    };
    db.estudiantes.push(nuevo);
    const ramaId = fd.get('rama_id');
    if(ramaId){ db.estudiante_rama.push({ id: uid('er'), estudiante_id: id, rama_id: ramaId, campus_id: campusId, fecha_inscripcion: todayStr(), estado: 'activo' }); }
    auditar('estudiantes', id, 'crear', nombreCompleto(nuevo)+' registrado');
    guardarDB();
    location.hash = '#/estudiantes';
    render();
    return false;
  },

  crearAsignacion(e, profesorId){
    e.preventDefault();
    const usuario = usuarioActual();
    if(!esGestion(usuario.rol)){ alert('No tiene permisos para asignar profesores.'); return false; }
    const fd = new FormData(e.target);
    const ramaId = fd.get('rama_id'), campusId = fd.get('campus_id'), tipo = fd.get('tipo');

    const existente = db.profesor_rama.find(pr=>pr.profesor_id===profesorId && pr.rama_id===ramaId && pr.campus_id===campusId && pr.tipo===tipo);
    if(existente){
      if(existente.activo){ alert('Ese profesor ya tiene esa asignación.'); return false; }
      existente.activo = true; existente.asignado_por = usuario.id; existente.fecha_creacion = new Date().toISOString();
      auditar('profesor_rama', existente.id, 'editar', 'Reactivada asignación');
    } else {
      const nueva = { id: uid('pr'), profesor_id: profesorId, rama_id: ramaId, campus_id: campusId, tipo, activo: true, asignado_por: usuario.id, fecha_creacion: new Date().toISOString() };
      db.profesor_rama.push(nueva);
      auditar('profesor_rama', nueva.id, 'crear', 'Nueva asignación ('+tipo+')');
    }
    guardarDB();
    render();
    return false;
  },

  quitarAsignacion(asignacionId, profesorId){
    const usuario = usuarioActual();
    if(!esGestion(usuario.rol)){ alert('No tiene permisos para modificar asignaciones.'); return; }
    if(!confirm('¿Quitar esta asignación? El profesor dejará de ver ese campus/rama y de poder pasar asistencia ahí.')) return;
    const pr = db.profesor_rama.find(x=>x.id===asignacionId);
    if(pr) pr.activo = false;
    auditar('profesor_rama', asignacionId, 'eliminar', 'Asignación desactivada');
    guardarDB();
    render();
  },

  crearProfesor(e){
    e.preventDefault();
    const usuario = usuarioActual();
    if(!esGestion(usuario.rol)){ alert('No tiene permisos para gestionar profesores.'); return false; }
    const fd = new FormData(e.target);
    const nuevo = {
      id: uid('prof'), usuario_id: null,
      nombres: fd.get('nombres'), apellidos: fd.get('apellidos'),
      telefono: fd.get('telefono') || null, email: fd.get('email') || null,
      activo: true
    };
    db.profesores.push(nuevo);
    auditar('profesores', nuevo.id, 'crear', nombreCompleto(nuevo)+' registrado');
    guardarDB();
    location.hash = '#/profesores';
    render();
    return false;
  },

  cambiarEstadoProfesor(profesorId, activo){
    const usuario = usuarioActual();
    if(!esGestion(usuario.rol)){ alert('No tiene permisos para gestionar profesores.'); return; }
    const mensaje = activo
      ? '¿Reactivar a este profesor?'
      : '¿Desactivar a este profesor? No se borra su historial de horarios ni asistencia registrada; solo deja de aparecer como disponible para nuevas asignaciones.';
    if(!confirm(mensaje)) return;
    const p = db.profesores.find(x=>x.id===profesorId);
    if(!p) return;
    p.activo = activo;
    auditar('profesores', profesorId, activo ? 'activar' : 'desactivar', nombreCompleto(p));
    guardarDB();
    render();
  },

  descargarPlantilla(){
    const blob = new Blob(['﻿'+plantillaCsv()], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'plantilla_estudiantes_rewa.csv'; a.click();
    URL.revokeObjectURL(url);
  },

  procesarArchivoImportacion(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { importacionFilas = parsearCsv(String(ev.target.result)); render(); };
    reader.readAsText(file);
  },

  confirmarImportacion(){
    if(!importacionFilas) return;
    const usuario = usuarioActual();
    const validadas = importacionFilas.map(f=>({...f, ...validarFilaImportacion(f)}));
    let creados=0, errores=0, duplicados=0;
    validadas.forEach(v=>{
      if(v.errores.length>0){ errores++; return; }
      const id = uid('est');
      db.estudiantes.push({
        id, nombres: v.nombres, apellidos: v.apellidos, fecha_nacimiento: v.fecha_nacimiento,
        campus_principal_id: v.campusId, estado: 'activo',
        contacto_telefono: null, contacto_email: null,
        representante_nombre: v.representante_nombre, representante_telefono: v.representante_telefono,
        representante_email: null, curso: v.curso || null,
        contacto_emergencia_nombre: null, contacto_emergencia_telefono: null, observaciones_medicas: null
      });
      creados++;
      if(v.duplicado) duplicados++;
    });
    const impId = uid('imp');
    db.importaciones.push({ id: impId, nombre_archivo: 'importacion.csv', usuario: nombreCompleto(usuario), fecha: new Date().toISOString(), total_filas: validadas.length, creados, actualizados: 0, errores });
    auditar('estudiantes', impId, 'importar', creados+' creados, '+duplicados+' posibles duplicados, '+errores+' con errores');
    guardarDB();
    alert('Importación completada: '+creados+' estudiantes creados ('+duplicados+' posibles duplicados a revisar), '+errores+' filas con errores.');
    importacionFilas = null;
    location.hash = '#/estudiantes';
    render();
  },

  cancelarImportacion(){ importacionFilas = null; render(); },

  filtrarPagos(campo, valor){ pagosFiltro[campo] = valor; render(); },
  toggleCampusPagos(campusId){
    if(pagosCampusAbiertos.has(campusId)) pagosCampusAbiertos.delete(campusId);
    else pagosCampusAbiertos.add(campusId);
    render();
  },

  generarMensualidadesPeriodo(){
    const usuario = usuarioActual();
    const mes = Number(pagosFiltro.mes), anio = Number(pagosFiltro.anio);
    let creadas = 0;
    db.estudiante_rama.filter(er=>er.estado==='activo').forEach(er=>{
      const est = db.estudiantes.find(e=>e.id===er.estudiante_id);
      if(!est || est.estado!=='activo') return;
      const existe = db.mensualidades.some(m=>m.estudiante_id===er.estudiante_id && m.rama_id===er.rama_id && m.periodo_mes===mes && m.periodo_anio===anio);
      if(existe) return;
      const rama = db.ramas.find(r=>r.id===er.rama_id);
      const fechaLimite = dateOnly(new Date(anio, mes, 5));
      db.mensualidades.push({ id: uid('mens'), estudiante_id: er.estudiante_id, rama_id: er.rama_id, periodo_mes: mes, periodo_anio: anio,
        monto_base: rama.monto_mensual_base, total_descuentos: 0, total_becas: 0, total_exoneraciones: 0,
        total_a_pagar: rama.monto_mensual_base, total_pagado: 0, saldo: rama.monto_mensual_base,
        estado: 'pendiente', fecha_limite: fechaLimite, observacion: null, creado_por: usuario.id, fecha_creacion: new Date().toISOString() });
      creadas++;
    });
    auditar('mensualidades', '-', 'generar_periodo', creadas+' mensualidades generadas para '+MESES[mes-1]+' '+anio);
    guardarDB();
    alert(creadas+' mensualidades nuevas generadas para el periodo (las ya existentes no se duplican).');
    render();
  },

  registrarPago(e, mensualidadId){
    e.preventDefault();
    const usuario = usuarioActual();
    const fd = new FormData(e.target);
    const monto = round2(Number(fd.get('monto')));
    const m = db.mensualidades.find(x=>x.id===mensualidadId);
    if(!(monto > 0)){ alert('El monto debe ser mayor a 0.'); return false; }
    if(monto > m.saldo){ alert('El abono ('+fmtMoney(monto)+') excede el saldo pendiente ('+fmtMoney(m.saldo)+').'); return false; }
    const pago = { id: uid('pago'), mensualidad_id: mensualidadId, monto, fecha_pago: todayStr(), metodo_pago: fd.get('metodo_pago'),
      referencia: fd.get('referencia') || null, comprobante_nombre: null, observacion: fd.get('observacion') || null,
      estado: 'activo', motivo_anulacion: null, usuario_registro: usuario.id, fecha_registro: new Date().toISOString(), usuario_anulacion: null, fecha_anulacion: null };
    db.pagos.push(pago);
    recalcularMensualidad(db, mensualidadId);
    auditar('pagos', pago.id, 'crear', fmtMoney(monto)+' registrado por '+fd.get('metodo_pago'));
    guardarDB();
    render();
    return false;
  },

  anularPago(pagoId, mensualidadId){
    mostrarModal(h`
      <h3 style="margin-bottom:4px">Anular pago</h3>
      <p class="muted" style="margin-bottom:14px">El saldo de la mensualidad se recalculará automáticamente.</p>
      <form onsubmit="return app.confirmarAnularPago(event,'${pagoId}','${mensualidadId}')">
        <div class="field"><label>Motivo de anulación</label><textarea name="motivo" rows="2" required></textarea></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
          <button type="button" class="btn btn-outline" onclick="app.cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-danger">Anular pago</button>
        </div>
      </form>
    `);
  },
  confirmarAnularPago(e, pagoId, mensualidadId){
    e.preventDefault();
    const motivo = String(new FormData(e.target).get('motivo') || '').trim();
    if(!motivo) return false;
    const usuario = usuarioActual();
    const p = db.pagos.find(x=>x.id===pagoId);
    p.estado = 'anulado'; p.motivo_anulacion = motivo; p.usuario_anulacion = usuario.id; p.fecha_anulacion = new Date().toISOString();
    recalcularMensualidad(db, mensualidadId);
    auditar('pagos', pagoId, 'anular', motivo);
    guardarDB();
    cerrarModal();
    render();
    return false;
  },

  anularAjuste(ajusteId, mensualidadId){
    mostrarModal(h`
      <h3 style="margin-bottom:4px">Anular ajuste</h3>
      <p class="muted" style="margin-bottom:16px">El saldo de la mensualidad se recalculará automáticamente.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-outline" onclick="app.cerrarModal()">Cancelar</button>
        <button class="btn btn-danger" onclick="app.confirmarAnularAjuste('${ajusteId}','${mensualidadId}')">Anular ajuste</button>
      </div>
    `);
  },
  confirmarAnularAjuste(ajusteId, mensualidadId){
    const a = db.ajustes.find(x=>x.id===ajusteId);
    a.estado = 'anulado';
    recalcularMensualidad(db, mensualidadId);
    auditar('ajustes_mensualidad', ajusteId, 'anular', 'Ajuste de '+a.tipo+' anulado');
    guardarDB();
    cerrarModal();
    render();
  },

  cerrarModal,

  editarCostoRama(ramaId){ ramaEditandoId = ramaId; render(); },
  cancelarEdicionCosto(){ ramaEditandoId = null; render(); },
  guardarCostoRama(e, ramaId){
    e.preventDefault();
    const usuario = usuarioActual();
    if(!esGestion(usuario.rol)){ alert('No tiene permisos para modificar costos de mensualidad.'); return false; }
    const fd = new FormData(e.target);
    const monto = Number(fd.get('monto'));
    if(!(monto >= 0)){ alert('El monto debe ser mayor o igual a 0.'); return false; }
    const rama = db.ramas.find(r=>r.id===ramaId);
    const montoAnterior = rama.monto_mensual_base;
    rama.monto_mensual_base = monto;
    auditar('ramas', ramaId, 'editar_costo', 'Costo de '+rama.nombre+' cambiado de '+fmtMoney(montoAnterior)+' a '+fmtMoney(monto));
    ramaEditandoId = null;
    guardarDB();
    render();
    return false;
  },

  agregarAjuste(e, mensualidadId){
    e.preventDefault();
    const usuario = usuarioActual();
    const fd = new FormData(e.target);
    const tipo = fd.get('tipo'), valorTipo = fd.get('valor_tipo'), valor = Number(fd.get('valor')), motivo = String(fd.get('motivo')||'');
    if(valorTipo==='porcentaje' && (valor<=0 || valor>100)){ alert('El porcentaje debe estar entre 1 y 100.'); return false; }
    if(valorTipo==='monto' && valor<=0){ alert('El monto debe ser mayor a 0.'); return false; }
    if(!motivo.trim()){ alert('El motivo es obligatorio.'); return false; }
    const aj = { id: uid('aj'), mensualidad_id: mensualidadId, tipo, valor_tipo: valorTipo, valor, motivo, usuario_id: usuario.id, fecha: new Date().toISOString(), estado: 'activo' };
    db.ajustes.push(aj);
    recalcularMensualidad(db, mensualidadId);
    auditar('ajustes_mensualidad', aj.id, 'crear', tipo+' de '+(valorTipo==='porcentaje' ? valor+'%' : fmtMoney(valor)));
    guardarDB();
    render();
    return false;
  },

  crearJustificacion(e){
    e.preventDefault();
    const usuario = usuarioActual();
    const fd = new FormData(e.target);
    const archivo = fd.get('adjunto');
    const j = { id: uid('jus'), estudiante_id: fd.get('estudiante_id'), sesion_id: null, fecha: fd.get('fecha'), rama_id: fd.get('rama_id'),
      tipo: fd.get('tipo'), motivo: fd.get('motivo'), observacion: fd.get('observacion') || null,
      adjunto_nombre: (archivo && archivo.name) ? archivo.name : null, adjunto_url: null,
      usuario_id: usuario.id, fecha_creacion: new Date().toISOString() };
    db.justificaciones.push(j);
    auditar('justificaciones', j.id, 'crear', 'Justificación '+j.tipo+' registrada');
    guardarDB();
    alert('Justificación registrada.');
    render();
    return false;
  },

  exportarCarteraCsv(){
    const cartera = db.mensualidades.filter(m=>['pendiente','parcial','vencido'].includes(estadoEfectivo(m)));
    const encabezado = ['Estudiante','Rama','Periodo','Saldo','Fecha limite','Estado'];
    const filas = cartera.map(m=>{
      const e = db.estudiantes.find(x=>x.id===m.estudiante_id);
      const r = db.ramas.find(x=>x.id===m.rama_id);
      return [nombreCompleto(e), r?.nombre, MESES[m.periodo_mes-1]+' '+m.periodo_anio, m.saldo, m.fecha_limite, estadoEfectivo(m)];
    });
    const csv = [encabezado, ...filas].map(fila=> fila.map(v=> '"'+String(v ?? '').replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'cartera_pendiente_rewa.csv'; a.click();
    URL.revokeObjectURL(url);
  },
};
window.app = app;

cargarDB();
try {
  const raw = sessionStorage.getItem(SESSION_KEY);
  if(raw){ sesion = JSON.parse(raw); if(!usuarioActual()) sesion = null; }
} catch(e){ sesion = null; }
if(!location.hash) location.hash = sesion ? '#/inicio' : '#/login';
render();

})();
